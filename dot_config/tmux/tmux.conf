# Reset all options to defaults and remove all key bindings before setting them.
# This makes source-file idempotent: removed lines don't leave stale state.
unbind-key -a -T prefix
unbind-key -a -T root
unbind-key -a -T copy-mode
unbind-key -a -T copy-mode-vi
set -su default-terminal
set -su terminal-features
set -gu prefix
set -gu visual-bell
set -gu monitor-bell
set -gu mode-keys
set -gu history-limit
set -su escape-time
set -gu allow-passthrough
set -gu window-status-format
set -gu window-status-current-format
set -gu window-status-style
set -gu window-status-current-style
set -gu window-status-bell-style
set -gu mode-style
set -gu message-style
set -gu status
set -gu status-style
set -gu status-justify
set -gu status-left
set -gu status-left-length
set -gu status-right
set -gu status-right-length
set -gu status-format
set -gu pane-border-style
set -gu pane-active-border-style
set -gu pane-border-indicators
set -gu pane-border-lines
set -gu pane-border-status
set -gu copy-mode-match-style
set -gu copy-mode-current-match-style
set -gu set-clipboard

# Full color terminal.
set -as terminal-features ",xterm-256color:RGB"
set -g allow-passthrough on

# Prevent escape key delay in tmux + vim.
set -s escape-time 0

# Behavior.
set -g prefix C-t
set -g visual-bell off
set -g monitor-bell on
set -g mode-keys vi
set -g history-limit 100000

# Colors.
set -g window-status-format "#[bg=#{?window_bell_flag,color241,color237},fg=#{?window_bell_flag,color109,color246}] #F#I #W "
set -g window-status-current-format "#[bg=color239]#[fg=color03] #F#I #W "
set -g window-status-bell-style default
set -g mode-style bg=color237,fg=color166
set -g message-style bg=color237,fg=color166
set -g pane-border-style bg=color00,fg=color239
set -g pane-active-border-style bg=color00,fg=color245
set -g pane-border-indicators colour
set -g pane-border-lines single
set -g pane-border-status off
set -g copy-mode-match-style bg=color166,fg=color00
set -g copy-mode-current-match-style bg=color208,fg=color237

# Two-high status line. Fill the upper status line with half-blocks.
set -g status-style bg=color237,fg=color248
set -g status-justify centre
set -g status-left ""
set -g status-left-length 0
set -g status-right ""
set -g status-right-length 0
set -g status 2
run-shell 'tmux set -g @upper "$(printf "▄%.0s" $(seq 1 300))"'
set -g status-format[0] "#[fill=color235,bg=color235,fg=color237]#{@upper}"
set -g status-format[1] "#[align=#{status-justify}]#{W:#[range=window|#{window_index}]#{T:window-status-format}#[norange default],#[range=window|#{window_index} list=focus]#{T:window-status-current-format}#[norange default]}"

# Basics.
bind-key t send-prefix
bind-key : command-prompt
bind-key ? list-keys
bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "loaded tmux.conf"
bind-key C-l clear-history \; display-message "cleared history"
bind-key d detach-client

# Sessions.
bind-key ( switch-client -p
bind-key ) switch-client -n
bind-key $ command-prompt -I "#S" { rename-session "%%" }
bind-key w choose-tree -Zw

# Windows.
bind-key C-c new-window
bind-key C-t last-window
bind-key C-n next-window
bind-key C-p previous-window
bind-key k confirm -p "kill-window? (y/n)" kill-window
bind-key , command-prompt -I "#W" { rename-window "%%" }
bind-key . command-prompt -T target { move-window -t "%%" }
bind-key f command-prompt { find-window -Z "%%" }
bind-key "'" command-prompt -T window-target -p index { select-window -t ":%%" }
bind-key 0 select-window -t :=0
bind-key 1 select-window -t :=1
bind-key 2 select-window -t :=2
bind-key 3 select-window -t :=3
bind-key 4 select-window -t :=4
bind-key 5 select-window -t :=5
bind-key 6 select-window -t :=6
bind-key 7 select-window -t :=7
bind-key 8 select-window -t :=8
bind-key 9 select-window -t :=9

# Split panes.
bind-key s split-window -c "#{@pwd}"  # horizontal split
bind-key C-s split-window -c "#{@pwd}"
bind-key v split-window -h -c "#{@pwd}"  # vertical split
bind-key C-v split-window -h -c "#{@pwd}"
bind-key ! break-pane
bind-key x kill-pane

# Select panes.
bind-key h select-pane -t :.+
bind-key C-h select-pane -t :.+
bind-key \; last-pane
bind-key -r Up select-pane -U
bind-key -r Down select-pane -D
bind-key -r Left select-pane -L
bind-key -r Right select-pane -R
bind-key q display-panes

# Arrange panes.
bind-key z resize-pane -Z
bind-key \{ swap-pane -U
bind-key \} swap-pane -D
bind-key C-o rotate-window
bind-key M-o rotate-window -D
bind-key Space next-layout
bind-key M-1 select-layout even-horizontal
bind-key M-2 select-layout even-vertical
bind-key M-3 select-layout main-horizontal
bind-key M-4 select-layout main-vertical
bind-key M-5 select-layout tiled

# Resize panes.
bind-key < resize-pane -L 14
bind-key > resize-pane -R 14
bind-key - resize-pane -U 7
bind-key + resize-pane -D 7
bind-key -r C-Up resize-pane -U
bind-key -r C-Down resize-pane -D
bind-key -r C-Left resize-pane -L
bind-key -r C-Right resize-pane -R

# Copy mode.
bind-key c copy-mode
bind-key -T copy-mode-vi C-c send -X cancel
bind-key -T copy-mode-vi q send -X cancel
bind-key -T copy-mode-vi Escape send -X cancel

bind-key -T copy-mode-vi d send -X cursor-left
bind-key -T copy-mode-vi h send -X cursor-down
bind-key -T copy-mode-vi t send -X cursor-up
bind-key -T copy-mode-vi n send -X cursor-right

bind-key -T copy-mode-vi Up send -X cursor-up
bind-key -T copy-mode-vi Down send -X cursor-down
bind-key -T copy-mode-vi Left send -X cursor-left
bind-key -T copy-mode-vi Right send -X cursor-right
bind-key -T copy-mode-vi BSpace send -X cursor-left

bind-key -T copy-mode-vi C-Up send -X scroll-up
bind-key -T copy-mode-vi C-Down send -X scroll-down
bind-key -T copy-mode-vi C-y send -X scroll-up
bind-key -T copy-mode-vi C-e send -X scroll-down
bind-key -T copy-mode-vi z send -X scroll-middle
bind-key -T copy-mode-vi C-u send -X halfpage-up
bind-key -T copy-mode-vi C-d send -X halfpage-down
bind-key -T copy-mode-vi C-b send -X page-up
bind-key -T copy-mode-vi C-f send -X page-down
bind-key -T copy-mode-vi PageUp send -X page-up
bind-key -T copy-mode-vi PageDown send -X page-down

bind-key -T copy-mode-vi Space send -X begin-selection
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi o send -X other-end

bind-key -T copy-mode-vi / command-prompt -i -p "search down" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "search up" "send -X search-backward-incremental \"%%%\""
bind-key -T copy-mode-vi j send -X search-again
bind-key -T copy-mode-vi J send -X search-reverse
bind-key -T copy-mode-vi * send -FX search-forward -- "#{copy_cursor_word}"
bind-key -T copy-mode-vi \# send -FX search-backward -- "#{copy_cursor_word}"

bind-key -T copy-mode-vi 0 send -X start-of-line
bind-key -T copy-mode-vi ^ send -X back-to-indentation
bind-key -T copy-mode-vi '$' send -X end-of-line
bind-key -T copy-mode-vi Home send -X start-of-line
bind-key -T copy-mode-vi End send -X end-of-line

bind-key -T copy-mode-vi w send -X next-word
bind-key -T copy-mode-vi b send -X previous-word
bind-key -T copy-mode-vi e send -X next-word-end
bind-key -T copy-mode-vi W send -X next-space
bind-key -T copy-mode-vi E send -X next-space-end
bind-key -T copy-mode-vi B send -X previous-space
bind-key -T copy-mode-vi \{ send -X previous-paragraph
bind-key -T copy-mode-vi \} send -X next-paragraph
bind-key -T copy-mode-vi % send -X next-matching-bracket
bind-key -T copy-mode-vi f command-prompt -1 -p "(jump forward)" { send -X jump-forward -- "%%" }
bind-key -T copy-mode-vi F command-prompt -1 -p "(jump backward)" { send -X jump-backward -- "%%" }
bind-key -T copy-mode-vi \; send -X jump-again
bind-key -T copy-mode-vi , send -X jump-reverse

bind-key -T copy-mode-vi g send -X history-top
bind-key -T copy-mode-vi G send -X history-bottom
bind-key -T copy-mode-vi : send -X goto-line
bind-key -T copy-mode-vi D send -X top-line
bind-key -T copy-mode-vi M send -X middle-line
bind-key -T copy-mode-vi N send -X bottom-line

bind-key -T copy-mode-vi 1 command-prompt -N -I 1 -p (repeat) { send -N "%%" }
bind-key -T copy-mode-vi 2 command-prompt -N -I 2 -p (repeat) { send -N "%%" }
bind-key -T copy-mode-vi 3 command-prompt -N -I 3 -p (repeat) { send -N "%%" }
bind-key -T copy-mode-vi 4 command-prompt -N -I 4 -p (repeat) { send -N "%%" }
bind-key -T copy-mode-vi 5 command-prompt -N -I 5 -p (repeat) { send -N "%%" }
bind-key -T copy-mode-vi 6 command-prompt -N -I 6 -p (repeat) { send -N "%%" }
bind-key -T copy-mode-vi 7 command-prompt -N -I 7 -p (repeat) { send -N "%%" }
bind-key -T copy-mode-vi 8 command-prompt -N -I 8 -p (repeat) { send -N "%%" }
bind-key -T copy-mode-vi 9 command-prompt -N -I 9 -p (repeat) { send -N "%%" }

# Disable tmux's native clipboard handling on Wayland where it's unsupported.
# Use wl-copy/wl-paste for clipboard operations.
set -g set-clipboard off
bind-key p run-shell 'wl-paste | tmux load-buffer - ; tmux paste-buffer'
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'
bind-key -T copy-mode-vi K send -X copy-pipe-and-cancel 'wl-copy'
